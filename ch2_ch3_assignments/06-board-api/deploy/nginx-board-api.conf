# nginx 사이트 설정 - 80 포트로 들어온 요청을 uvicorn(127.0.0.1:8000)으로 넘겨줍니다. (리버스 프록시)
# 위치: /etc/nginx/sites-available/board-api
# 활성화: sudo ln -s /etc/nginx/sites-available/board-api /etc/nginx/sites-enabled/

server {
    listen 80;
    # 도메인이 없으면 EC2 퍼블릭 IP 를 넣거나 _ (모든 이름) 로 둡니다.
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8000;
        # 원래 요청 정보(호스트, 클라이언트 IP, http/https)를 uvicorn 에 전달합니다.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
