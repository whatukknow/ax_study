<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- 히어로 배너용 간단한 일러스트 (직접 그린 도형, 외부 이미지 다운로드 없음) -->
  <rect width="600" height="400" rx="24" fill="#fff4e6"/>
  <!-- 쇼핑백 몸통 -->
  <rect x="190" y="140" width="220" height="200" rx="16" fill="#ff7a45"/>
  <!-- 쇼핑백 손잡이 -->
  <path d="M245 140 V110 a55 55 0 0 1 110 0 V140" fill="none" stroke="#d4380d" stroke-width="14" stroke-linecap="round"/>
  <!-- 쇼핑백 글자 -->
  <text x="300" y="255" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">MOA</text>
  <!-- 장식용 동그라미 -->
  <circle cx="110" cy="90" r="30" fill="#ffd591"/>
  <circle cx="500" cy="310" r="40" fill="#ffd591"/>
  <circle cx="480" cy="90" r="16" fill="#ff9c6e"/>
</svg>
