<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .box{
            width: 150px;
            height: 150px;
            background: pink;
            margin: 100px;
        }
        .box:nth-of-type(2){
            background: blueviolet;
        }

        .box:nth-of-type(3){
            background: orange;
        }

        .box:nth-of-type(4){
            background: greenyellow;
        }

    </style>
    <div class="box"> A </div>
    <div class="box"> B </div>

    <span class="box">C</span>
    <span class="box">D</span>
</body>
</html>
